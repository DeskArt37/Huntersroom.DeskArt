<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161615">
<title>D.A.E. HUNTERS ROOM · deskArt</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#161615;--red:#b92737;--red2:#b92737;--pu:#b92737;--pu2:#b92737;--tx:#fff;--mu:#9a9a9a;--bd:rgba(255,255,255,.12);--ok:#3ee6a8;--g:#b92737;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--tx);font:14px/1.55 'Plus Jakarta Sans',Inter,system-ui,sans-serif;background:var(--bg);padding:env(safe-area-inset-top,0px) 0 calc(100px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
@keyframes fl{to{transform:translate(40px,30px) scale(1.12)}}@keyframes up{from{opacity:0;transform:translateY(14px)}}@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}}@keyframes fade{from{opacity:0}}
.w{max-width:980px;margin:auto;padding:20px 18px}.in>*{animation:up .55s cubic-bezier(.2,.8,.2,1) both}.in>:nth-child(n+3){animation-delay:.07s}.in>:nth-child(n+5){animation-delay:.14s}.in>:nth-child(n+7){animation-delay:.2s}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.025));border:1px solid var(--bd);border-radius:22px;backdrop-filter:blur(26px) saturate(160%);-webkit-backdrop-filter:blur(26px) saturate(160%);padding:18px;box-shadow:0 14px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.13)}
h1{font-size:16px;margin:0;font-weight:800;letter-spacing:.4px}h1 b{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:15px;font-weight:700;margin:26px 0 12px;letter-spacing:.2px}.mu{color:var(--mu)}.sm{font-size:12px}.r{color:var(--red)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.bl,.who{display:flex;align-items:center;gap:11px}.wn{display:flex;flex-direction:column;line-height:1.25;text-transform:capitalize}
.logo{height:40px;width:auto;flex:none;}.lock{display:flex;align-items:center;gap:14px}.lock .logo{height:64px}.lock .wm{height:56px;width:auto}
.btn{background:rgba(255,255,255,.07);border:1px solid var(--bd);color:var(--tx);padding:10px 16px;border-radius:13px;font:inherit;font-weight:600;cursor:pointer;transition:.2s;text-decoration:none;display:inline-block}
.btn:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.11)}.btn:active{transform:scale(.97)}
.p{background:var(--g);border:0;font-weight:700;box-shadow:none}.p:hover{box-shadow:none}
.g{background:#25d366;color:#02140d;border:0;font-weight:700}.ghost{background:transparent;padding:7px 12px}
input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--bd);color:var(--tx);padding:12px 13px;border-radius:12px;font:inherit;margin:5px 0 12px;transition:.2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pu2);box-shadow:0 0 0 3px #b9273755;background:rgba(255,255,255,.08)}option{background:#1c1c1c}label{font-size:12px;color:var(--mu);font-weight:600}
.authwrap{min-height:100vh;max-width:1000px;margin:auto;padding:24px;display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center}
.brand h1{font-size:34px;line-height:1.1;margin:18px 0 12px}.brand p{color:var(--mu);font-size:15px;max-width:420px}.feat{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.feat span{padding:7px 13px;border-radius:99px;border:1px solid var(--bd);background:rgba(255,255,255,.05);font-size:12px}
.auth{width:100%;max-width:420px;margin:8vh auto}.authwrap .auth{margin:0 0 0 auto;animation:pop .6s both}
.tabs{display:flex;gap:6px;margin:0 0 16px;padding:5px;background:rgba(0,0,0,.35);border-radius:15px}.tabs .btn{flex:1;border:0;background:none}.tabs .on{background:var(--g);box-shadow:none}
.err{color:#ff8a9c;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.14);padding:9px 12px;border-radius:11px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}.k{color:var(--mu);font-size:12px;font-weight:600}.v{font-size:28px;font-weight:800;letter-spacing:-.5px}
.bar{height:7px;background:rgba(255,255,255,.08);border-radius:9px;margin:10px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.hero{border-color:#b92737!important;display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-color:#b92737;background:rgba(255,255,255,.07);box-shadow:0 14px 40px rgba(0,0,0,.5)}
.av{width:46px;height:46px;border-radius:50%;background:var(--g);display:grid;place-items:center;font-weight:800;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.12)}.sm2{width:36px;height:36px}
.hero .av{width:72px;height:72px;font-size:28px;box-shadow:0 0 0 4px rgba(255,255,255,.18),0 0 34px rgba(255,255,255,.14)}.hero>div:nth-child(2){flex:1;min-width:160px}
.rk{display:flex;gap:13px;align-items:center;margin-top:10px;padding:14px 16px;transition:.25s}.rk:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.14)}
.n{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:800;background:rgba(255,255,255,.07);flex:none}.m2{color:#e5e7ef}.m3{color:#e8a56a}
.pts{margin-left:auto;text-align:right;font-weight:800;font-size:17px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}.pts .sm,.pts div{color:var(--mu)}
.st{font-size:11px;font-weight:700;padding:4px 11px;border-radius:99px;border:1px solid rgba(255,255,255,.14);color:var(--pu2);background:rgba(255,255,255,.14);white-space:nowrap}
.ctr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;font-weight:600}.ctr div{display:flex;align-items:center;gap:14px}.ctr button{width:46px;height:46px;font-size:22px;padding:0;border-radius:14px}.ctr b{font-size:26px;min-width:34px;text-align:center}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:6px;background:rgba(22,16,17,.72);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--bd);border-radius:24px;box-shadow:0 16px 50px rgba(0,0,0,.6);z-index:5}
nav button{background:none;border:0;color:var(--mu);font:inherit;font-size:10px;font-weight:600;padding:9px 16px;border-radius:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.25s}nav button:hover{color:#fff}
nav .on{color:#fff;background:var(--g);box-shadow:none}
.ov{position:fixed;inset:0;background:rgba(5,3,10,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center;padding:16px;z-index:20;animation:fade .2s}.md{width:100%;max-width:420px;animation:pop .35s cubic-bezier(.2,.9,.3,1.15)}
#t{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:rgba(22,16,17,.9);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.14);padding:11px 18px;border-radius:14px;display:none;z-index:30;font-weight:600;animation:pop .3s}
@media(min-width:900px){body{padding-bottom:30px}nav{left:18px;top:18px;bottom:18px;transform:none;flex-direction:column;justify-content:center;gap:8px;width:82px;padding:10px 6px}.w{padding-left:120px}#t{bottom:30px}}
@media(max-width:820px){.authwrap{grid-template-columns:1fr;gap:20px;padding:20px 16px}.brand h1{font-size:26px}.authwrap .auth{margin:0 auto}}@media(max-width:560px){.wn{display:none}}
textarea{resize:vertical;min-height:70px}.bd{background:var(--red);border-radius:99px;padding:1px 8px;font-size:11px;margin-left:4px}.fr{border-color:var(--red)}.tabs.sub{overflow-x:auto}.tabs.sub .btn{white-space:nowrap;flex:none}.row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.ok{color:var(--ok)}h1 .st{color:#fff;background:var(--red);border-color:var(--red);margin-left:6px;vertical-align:middle}</style></head><body><div id="app"></div><div id="t"></div>

const dk=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

const ph=v=>{let d=String(v||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d[0]==='0')d='88'+d;else if(d.length===10&&d[0]==='1')d='880'+d;return/^\d{10,15}$/.test(d)?d:''};

let ready=0,D={users:[],profs:[],apps:[],reports:{},leads:[],deals:[],ann:[],set:{}},me=null,tab='home',mode='in',err='',note='',fsub='apps',modal='',DR={};
const pr=id=>D.profs.find(p=>p.id===id),nm=id=>me&&id===me.phone?'You':(pr(id)?.name||'Hunter');
const hunters=()=>D.profs.filter(p=>p.role==='hunter'&&p.active!==false),isF=()=>me&&me.role==='founder';
const rep=(h,day)=>D.reports[h+'_'+day]||{a:0,n:0,m:0};
const weekStart=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return dk(d)};
function weekStats(h){const ws=weekStart(),s={a:0,n:0,m:0,c:0};Object.entries(D.reports).forEach(([k,r])=>{const[u,d]=k.split('_');if(u===h&&d>=ws){s.a+=r.a;s.n+=r.n;s.m+=r.m}});s.c=D.deals.filter(x=>x.hid===h&&(x.closedAt||'')>=ws).length;s.pts=s.a+s.n*3+s.m*8+s.c*15;return s}
function streak(h){let c=0,d=new Date();if(!D.reports[h+'_'+dk(d)])d.setDate(d.getDate()-1);while(D.reports[h+'_'+dk(d)]){c++;d.setDate(d.getDate()-1)}return c}

function vAuth(){const T=[['in','Login'],['up','Sign up'],['apply','Apply']],i=(n,l,t='text',x='')=>`<label>${l}</label><input name="${n}" type="${t}" ${x}>`;
 const F={in:i('phone','WhatsApp number','tel','required autocomplete="username" placeholder="01XXXXXXXXX"')+i('pw','Password','password','required autocomplete="current-password"'),
 up:i('phone','WhatsApp number (must be approved)','tel','required autocomplete="username"')+i('pw','Create a password (min 8 characters)','password','required minlength="8" autocomplete="new-password"')+i('pw2','Confirm password','password','required minlength="8" autocomplete="new-password"')+'<p class="mu sm">Use a new password made only for Hunters Room. Never your WhatsApp password.</p>',
 apply:i('name','Full name','text','required maxlength="60"')+i('phone','WhatsApp number','tel','required')+i('dob','Date of birth','date','required')}[mode];
 return `<div class="authwrap"><div class="brand"><div class="lock"><img class="logo" src="${MARK}" alt="deskArt"><img class="wm" src="${TEXT}" alt="Desk Art"></div><h1>D.A.E. <b>HUNTERS ROOM</b></h1><p>The command center for deskArt's outbound team. New here? Apply, wait for the founders to approve you, then create your account.</p><div class="feat"><span>⚡ Daily reports</span><span>🏆 Weekly top 5</span><span>💬 WhatsApp meetings</span></div></div><div class="glass auth"><div class="tabs">${T.map(([k,n])=>`<button class="btn ${mode===k?'on':''}" data-m="${k}">${n}</button>`).join('')}</div>${err?`<div class="err">${E(err)}</div>`:''}${note?`<div class="err ok" style="border-color:var(--ok)">${E(note)}</div>`:''}<form id="af">${F}<button class="btn p" style="width:100%">${{in:'Login',up:'Create account',apply:'Send application'}[mode]}</button></form></div></div>`}
function vHome(){const H=hunters().map(p=>({p,...weekStats(p.id)})).sort((a,b)=>b.pts-a.pts),top=H.filter(x=>x.pts>0).slice(0,5),day=dk(),f=top[0],TG=+D.set.target||30,an=D.ann[0],FO=D.profs.filter(p=>p.role==='founder'&&p.show);
 let ta=0,tn=0,tm=0,done=[],miss=[];H.forEach(x=>{const r=rep(x.p.id,day);ta+=r.a;tn+=r.n;tm+=r.m;(D.reports[x.p.id+'_'+day]?done:miss).push(x.p.name)});
 return `${an?`<div class="glass fr" style="margin-bottom:6px"><span class="st">📣 From the founders</span><div style="font-weight:800;margin-top:6px">${E(an.title)}</div><div class="mu" style="white-space:pre-wrap">${E(an.body)}</div></div>`:''}
<h2 style="margin-top:14px">🔥 Hunters of the Week</h2>${f?`<div class="glass hero">${av(f.p.name)}<div><span class="st">👑 #1 Hunter of the Week</span><div style="font-size:20px;font-weight:800;margin-top:4px">${E(f.p.name)}</div><div class="mu sm">${f.a} approached · ${f.n} negotiating · ${f.m} meetings fixed · ${f.c} deals closed</div></div><div class="pts" style="font-size:28px">${f.pts}<div class="mu sm">pts</div></div></div>`:'<div class="glass mu">No activity yet this week. Submit today\'s report to take the #1 spot!</div>'}
${top.slice(1).map((x,i)=>`<div class="glass rk"><span class="n m${i+2}">${i+2}</span>${av(x.p.name)}<div><b>${E(x.p.name)}</b><div class="mu sm">${x.a} approached · ${x.n} negotiating · ${x.m} meetings · ${x.c} closed</div></div><div class="pts">${x.pts}</div></div>`).join('')}
<h2>🏢 Office today</h2><div class="glass"><div class="grid"><div><div class="k">Approached</div><div class="v">${ta}</div></div><div><div class="k">Negotiating</div><div class="v">${tn}</div></div><div><div class="k">Deals fixed</div><div class="v r">${tm}</div></div><div><div class="k">Reported</div><div class="v">${done.length}/${H.length}</div></div></div><div class="bar"><i style="width:${Math.min(100,ta/TG*100)}%"></i></div><div class="mu sm">Team target: ${ta}/${TG} approaches today</div>${miss.length?`<div class="sm" style="margin-top:8px">⏰ Not reported yet: <span class="mu">${miss.map(E).join(', ')}</span></div>`:''}</div>
${me.role==='hunter'?`<div class="glass" style="margin-top:12px">🔥 Your streak: <b class="r">${streak(me.phone)} day${streak(me.phone)===1?'':'s'}</b> ${D.reports[me.phone+'_'+day]?'· today\'s report done ✅':'· <button class="btn p" data-t="report">Submit today\'s report</button>'}</div>`:''}

 return `<h2 style="margin-top:6px">Daily report · ${dk()}</h2><div class="glass" style="max-width:480px">${row('a','Clients approached')}${row('n','In negotiation')}${row('m','Deals fixed (meeting)')}<button class="btn p" style="width:100%" data-a="rep">Submit report</button><p class="mu sm">Tap + or − then submit. You can update it again any time today.</p></div>`}
function vLeads(){const L=D.leads.slice().sort((a,b)=>b.ts-a.ts),mx=isF()?4:3;
 return `<h2 style="margin-top:6px">Leads</h2><div class="top" style="margin-bottom:12px"><span class="mu">${L.length} lead${L.length==1?'':'s'}</span><button class="btn p" data-modal="lead">+ New lead</button></div>
 ${L.length?L.map(l=>{const i=STAGES.indexOf(l.stage),w=ph(l.phone);return `<div class="glass" style="margin-top:8px"><div class="top"><div><b>${E(l.company)}</b><div class="mu sm">${E(l.contact)} · ${E(l.phone)}${isF()?' · by '+E(nm(l.hid)):''}</div></div><span class="st">${l.stage}</span></div><div class="bar"><i style="width:${(i+1)*20}%"></i></div><div class="row2" style="margin-top:0">${i<mx?`<button class="btn" data-adv="${l.id}">Move to ${STAGES[i+1]} →</button>`:''}${i===3&&!isF()?'<span class="mu sm">Founders confirm the final deal.</span>':''}${l.stage==='Client Ready'&&w?`<a class="btn g" target="_blank" rel="noopener" href="https://wa.me/${w}?text=${encodeURIComponent('Hello '+l.contact+', thank you for your interest. Let\'s fix a meeting with the deskArt team for '+l.company+'. What day and time suit you?')}">Fix meeting on WhatsApp</a>`:''}</div></div>`}).join(''):'<p class="mu">No leads yet. Add your first client above.</p>'}`}
function vFR(){const P=D.apps.filter(a=>a.status==='pending'),S=[['apps','Applications'+(P.length?`<span class="bd">${P.length}</span>`:'')],['hun','Hunters'],['fou','Founders'],['upd','Updates']],i=(n,l,t='text',x='')=>`<label>${l}</label><input name="${n}" type="${t}" ${x}>`;
 const tabsH=`<div class="tabs sub">${S.map(([k,n])=>`<button class="btn ${fsub===k?'on':''}" data-sub="${k}">${n}</button>`).join('')}</div>`;
 let b='';
 if(fsub==='apps')b=`<h2 style="margin-top:0">Pending applications</h2>${P.length?P.map(a=>`<div class="glass" style="margin-bottom:8px"><div class="top"><div><b>${E(a.name)}</b><div class="mu sm">+${E(a.phone)} · DOB ${E(a.dob)} · ${new Date(a.ts).toLocaleDateString()}</div></div><div class="row2" style="margin:0"><button class="btn g" data-ap="${a.id}">Approve</button><button class="btn" data-rj="${a.id}">Reject</button></div></div></div>`).join(''):'<p class="mu">No pending applications.</p>'}<h2>Add a hunter directly</h2><form id="addh" class="glass" style="max-width:460px">${i('name','Full name','text','required maxlength="60"')}${i('phone','WhatsApp number','tel','required')}${i('dob','Date of birth','date','required')}<button class="btn p" style="width:100%">Add & approve</button><p class="mu sm">They then open the site → Sign up with this number and choose their own password.</p></form>`;
 if(fsub==='hun'){const H=hunters();b=`<h2 style="margin-top:0">Hunters (${H.length})</h2>${H.map(p=>{const u=D.users.find(x=>x.phone===p.id),a=D.apps.find(x=>x.id===p.id);return `<div class="glass" style="margin-bottom:8px"><div class="top"><div class="bl">${av(p.name,'sm2')}<div><b>${E(p.name)}</b><div class="mu sm">+${E(p.id)}${a?' · DOB '+E(a.dob):''}</div><div class="sm ${u?'ok':'mu'}">${u?'Account active':'Not signed up yet'}</div></div></div><div class="row2" style="margin:0"><a class="btn g" target="_blank" rel="noopener" href="https://wa.me/${E(p.id)}">WhatsApp</a><button class="btn" data-rs="${E(p.id)}">Reset password</button><button class="btn" data-rm="${E(p.id)}" style="color:#ff8a9c">Remove</button></div></div></div>`}).join('')||'<p class="mu">No hunters yet.</p>'}<p class="mu sm">Passwords are never stored or visible to anyone. If a hunter forgets theirs, press Reset password and they sign up again with the same number (their leads and reports stay).</p>`}
 if(fsub==='fou'){const FO=D.profs.filter(p=>p.role==='founder'),HU=hunters().filter(p=>D.users.some(u=>u.phone===p.id));b=`<h2 style="margin-top:0">Founders shown in Hunters Room</h2>${FO.map(p=>`<form class="glass fed" style="margin-bottom:8px"><input type="hidden" name="phone" value="${E(p.id)}"><b>${E(p.name)}</b> <span class="mu sm">+${E(p.id)}</span>${i('title','Title (e.g. CEO)','text','maxlength="60" value="'+E(p.title)+'"')}<label>Short bio</label><textarea name="bio" maxlength="300">${E(p.bio)}</textarea><label><input type="checkbox" name="show" ${p.show?'checked':''} style="width:auto;margin-right:6px">Show on Hunters Room home</label><div class="row2"><button class="btn p">Save</button>${p.id!==me.phone?`<button type="button" class="btn" data-dem="${E(p.id)}">Make hunter</button>`:''}</div></form>`).join('')}<h2>Promote a hunter to founder</h2>${HU.length?`<form id="prom" class="glass" style="max-width:460px"><select name="phone">${HU.map(p=>`<option value="${E(p.id)}">${E(p.name)}</option>`).join('')}</select><button class="btn p" style="width:100%">Make founder</button></form>`:'<p class="mu">No active hunter accounts.</p>'}`}
 if(fsub==='upd')b=`<h2 style="margin-top:0">Post an update to all hunters</h2><form id="post" class="glass" style="max-width:520px">${i('title','Title','text','required maxlength="80"')}<label>Message</label><textarea name="body" required maxlength="600"></textarea><button class="btn p" style="width:100%">Publish</button></form>${D.ann.map(a=>`<div class="glass" style="margin-top:8px"><div class="top"><b>${E(a.title)}</b><button class="btn ghost" data-da="${a.id}">Delete</button></div><div class="mu sm" style="white-space:pre-wrap">${E(a.body)}</div></div>`).join('')}<h2>Settings</h2><form id="set" class="glass" style="max-width:320px">${i('target','Daily team target (approaches)','number','required min="1" max="500" value="'+(+D.set.target||30)+'"')}<button class="btn p" style="width:100%">Save</button></form>`;
 return `<div class="glass fr"><h1>D.A <b>FOUNDERS ROOM</b> <span class="st">H.C</span></h1><div class="mu sm">Control center · only founders can see this</div></div><div style="height:12px"></div>${tabsH}${b}`}
function vModal(){return modal?`<div class="ov"><form id="lf" class="glass md"><div class="top" style="margin-bottom:12px"><h2 style="margin:0">New lead</h2><button type="button" class="btn ghost" data-close="1">✕</button></div><label>Company</label><input name="company" required maxlength="80" autofocus><label>Contact person</label><input name="contact" required maxlength="60"><label>WhatsApp number</label><input name="phone" type="tel" required maxlength="20"><button class="btn p" style="width:100%">Add lead</button></form></div>`:''}
function render(){
 if(!ready){A.innerHTML='<div class="w mu">Loading…</div>';return}
 if(!me){A.innerHTML=vAuth();return}
 const V={home:vHome,report:vReport,leads:vLeads,fr:vFR};if(!V[tab]||(tab==='fr'&&!isF())||(tab==='report'&&isF()))tab='home';
 const T=[['home','Home'],...(isF()?[]:[['report','Report']]),['leads','Leads'],...(isF()?[['fr','Founders']]:[])];
 const an=render.l!==tab+me.uid;render.l=tab+me.uid;
 A.innerHTML=`<div class="w${an?' in':''}"><div class="top"><div class="bl"><img class="logo" src="${MARK}" alt="deskArt"><div><h1>D.A.E. <b>HUNTERS ROOM</b></h1><div class="mu sm">deskArt agency</div></div></div><div class="who">${av(me.name,'sm2')}<div class="wn"><b>${E(me.name)}</b><span class="mu sm">${me.role}</span></div><button class="btn ghost" data-a="out">Logout</button></div></div>${V[tab]()}</div><nav>${T.map(([k,n])=>`<button data-t="${k}" class="${tab===k?'on':''}">${IC[k]}<span>${n}</span></button>`).join('')}</nav>${vModal()}`}

/* ===== FIREBASE SYNC ===== */
const dbc=n=>collection(fs,n),fail=e=>say(e&&(e.message&&!e.code?e.message:(e.code||'Error')));
const FE={'auth/invalid-credential':'Wrong number or password.','auth/weak-password':'Password must be at least 8 characters.','auth/too-many-requests':'Too many tries. Wait a few minutes.','auth/network-request-failed':'No internet connection.','auth/user-disabled':'This account is disabled.'};
let unsubs=[],uU=null,started=0;
const soft=()=>{if(!modal&&!(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)))render()};
function stop(){unsubs.forEach(f=>f());unsubs=[];started=0;D={users:[],profs:[],apps:[],reports:{},leads:[],deals:[],ann:[],set:{}}}
function feed(){if(started)return;started=1;const L=s=>s.docs.map(d=>({id:d.id,...d.data()})),w=(q,fn)=>unsubs.push(onSnapshot(q,s=>{fn(s);soft()},fail));
 w(dbc('profiles'),s=>D.profs=L(s));w(dbc('reports'),s=>{D.reports={};s.docs.forEach(d=>D.reports[d.id]=d.data())});
 w(isF()?dbc('leads'):query(dbc('leads'),where('hid','==',me.phone)),s=>D.leads=L(s));w(dbc('deals'),s=>D.deals=L(s));
 w(dbc('announcements'),s=>D.ann=L(s).sort((a,b)=>b.ts-a.ts));w(doc(fs,'settings','main'),s=>D.set=s.exists()?s.data():{});
 if(isF()){w(dbc('users'),s=>D.users=L(s));w(dbc('applications'),s=>D.apps=L(s).sort((a,b)=>b.ts-a.ts))}}
function wrong(isFounder){me=null;stop();A.innerHTML=isFounder?'<div class="glass auth"><h1>This is the Hunters Room</h1><p class="mu">Founders use the separate Founders Room.</p><a class="btn p" href="founders.html" style="width:100%;text-align:center">Open Founders Room</a><div style="height:8px"></div><button class="btn" id="lo" style="width:100%">Logout</button></div>':'<div class="glass auth"><h1>Founders only</h1><p class="mu">This page is only for founders. Hunters use the Hunters Room.</p><a class="btn p" href="index.html" style="width:100%;text-align:center">Go to Hunters Room</a><div style="height:8px"></div><button class="btn" id="lo" style="width:100%">Logout</button></div>';document.getElementById('lo').onclick=()=>signOut(auth)}
onAuthStateChanged(auth,u=>{stop();uU&&uU();uU=null;if(!u){me=null;ready=1;render();return}
 uU=onSnapshot(doc(fs,'users',u.uid),s=>{ready=1;if(!s.exists()||!s.data().ok){me=null;A.innerHTML='<div class="glass auth"><h1>Setting up your account…</h1><p class="mu">If this stays, your access was removed or reset. Contact the founders.</p><button class="btn" id="lo">Logout</button></div>';document.getElementById('lo').onclick=()=>signOut(auth);return}
  const d=s.data();if((PAGE==='founders')!==(d.role==='founder')){wrong(d.role==='founder');return}const first=!me;me={uid:s.id,...d};feed();if(first)tab=PAGE==='founders'?'fr':'home';render()},fail)});

/* ===== ACTIONS ===== */
async function approve(name,phone,dob){const gr=doc(fs,'gate',phone),g=await getDoc(gr),ver=g.exists()?g.data().ver||0:0,p0=await getDoc(doc(fs,'profiles',phone)),b=writeBatch(fs);
 b.set(gr,{status:'approved',ver,name});b.set(doc(fs,'applications',phone),{name,phone,dob,status:'approved',ts:Date.now()});
 if(p0.exists())b.update(doc(fs,'profiles',phone),{active:true,name});else b.set(doc(fs,'profiles',phone),{name,role:'hunter',active:true,title:'',bio:'',show:false});
 await b.commit()}
async function revoke(phone,remove){const gr=doc(fs,'gate',phone),g=await getDoc(gr),ver=(g.exists()?g.data().ver||0:0)+1,p=pr(phone),u=D.users.find(x=>x.phone===phone),b=writeBatch(fs);
 b.set(gr,{status:remove?'removed':'approved',ver,name:p?p.name:'Hunter'});b.delete(doc(fs,'claims',phone));if(u)b.delete(doc(fs,'users',u.id));if(remove&&p)b.update(doc(fs,'profiles',phone),{active:false});await b.commit()}
async function signup(phone,pw){const g=await getDoc(doc(fs,'gate',phone));if(!g.exists()||g.data().status!=='approved')throw{message:'This number is not approved yet. Send an application and wait for the founders.'};
 const ver=g.data().ver||0,email=em(phone,ver);
 try{await createUserWithEmailAndPassword(auth,email,pw)}catch(x){if(x.code==='auth/email-already-in-use')await signInWithEmailAndPassword(auth,email,pw);else throw x}
 const uid=auth.currentUser.uid,b=writeBatch(fs);b.set(doc(fs,'claims',phone),{uid,ver});b.set(doc(fs,'users',uid),{name:g.data().name,phone,role:'hunter',ok:true,ver,created:Date.now()});
 try{await b.commit()}catch(x){await signOut(auth);throw{message:'This number already has an account. Please login, or ask the founders to reset it.'}}}
async function login(phone,pw){const g=await getDoc(doc(fs,'gate',phone));await signInWithEmailAndPassword(auth,em(phone,g.exists()?g.data().ver||0:0),pw)}

/* ===== EVENTS ===== */
document.addEventListener('click',async e=>{if(e.target.classList&&e.target.classList.contains('ov')){modal='';render();return}const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 try{
 if(d.m){mode=d.m;err='';note='';render()}
 else if(d.modal){modal=d.modal;render()}
 else if(d.close){modal='';render()}
 else if(d.t){tab=d.t;render()}
 else if(d.sub){fsub=d.sub;render()}
 else if(d.a==='out'){await signOut(auth)}
 else if(d.c){const k=d.c[0],key=me.phone+'_'+dk(),r={...(DR[key]||rep(me.phone,dk()))};r[k]=Math.max(0,Math.min(1000,r[k]+(d.c[1]==='+'?1:-1)));DR[key]=r;render()}
 else if(d.a==='rep'){const key=me.phone+'_'+dk(),r=DR[key]||rep(me.phone,dk());await setDoc(doc(fs,'reports',key),{hid:me.phone,day:dk(),a:r.a,n:r.n,m:r.m});delete DR[key];say('Report submitted ✅');tab='home';render()}
 else if(d.adv){const l=D.leads.find(x=>x.id===d.adv),st=STAGES[STAGES.indexOf(l.stage)+1],u={stage:st};if(st==='Closed'){u.closedAt=dk();await addDoc(dbc('deals'),{hid:l.hid,closedAt:dk()})}await updateDoc(doc(fs,'leads',l.id),u);say('Moved to '+st)}
 else if(d.ap){const a=D.apps.find(x=>x.id===d.ap);await approve(a.name,a.phone,a.dob);say('Approved ✅ — they can Sign up now')}
 else if(d.rj){await updateDoc(doc(fs,'applications',d.rj),{status:'rejected'});say('Rejected')}
 else if(d.rs){if(confirm('Reset this hunter\'s password? They must Sign up again with the same number.')){await revoke(d.rs,false);say('Reset done. Ask them to Sign up again.')}}
 else if(d.rm){if(confirm('Remove this hunter from the website?')){await revoke(d.rm,true);say('Hunter removed')}}
 else if(d.dem){const u=D.users.find(x=>x.phone===d.dem);if(u&&confirm('Make this founder a hunter again?')){const bt=writeBatch(fs);bt.update(doc(fs,'users',u.id),{role:'hunter'});bt.update(doc(fs,'profiles',d.dem),{role:'hunter',show:false});await bt.commit()}}
 else if(d.da){await deleteDoc(doc(fs,'announcements',d.da))}
 }catch(x){fail(x)}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),id=e.target.id,btn=e.target.querySelector('.p');if(btn)btn.disabled=true;
 try{
 if(id==='af'){err='';note='';const p=ph(f.phone);
  try{if(!p)throw{message:'Enter a valid WhatsApp number.'};
   if(mode==='apply'){if(f.dob>dk())throw{message:'Invalid date of birth.'};await setDoc(doc(fs,'applications',p),{name:f.name.trim(),phone:p,dob:f.dob,status:'pending',ts:Date.now()});note='Application sent ✅ The founders will review it. After approval, use Sign up.';mode='in'}
   else if(mode==='up'){if(f.pw!==f.pw2)throw{message:'Passwords do not match.'};await signup(p,f.pw);localStorage.setItem('dae_last',Date.now())}
   else{await login(p,f.pw);localStorage.setItem('dae_last',Date.now())}}
  catch(x){err=FE[x.code]||(x.code==='permission-denied'?(mode==='apply'?'This number already applied or is already a member.':'Not allowed.'):x.message)||'Something went wrong.'}
  render();return}
 if(id==='lf'){await addDoc(dbc('leads'),{hid:me.phone,company:f.company.trim(),contact:f.contact.trim(),phone:f.phone.trim(),stage:'Approached',ts:Date.now()});modal='';say('Lead added');render();return}
 if(id==='addh'){const p=ph(f.phone);if(!p)throw{message:'Enter a valid WhatsApp number.'};await approve(f.name.trim(),p,f.dob);e.target.reset();say('Hunter added ✅')}
 else if(id==='prom'){const u=D.users.find(x=>x.phone===f.phone),bt=writeBatch(fs);bt.update(doc(fs,'users',u.id),{role:'founder'});bt.update(doc(fs,'profiles',f.phone),{role:'founder',show:true});await bt.commit();say('Promoted to founder')}
 else if(e.target.classList.contains('fed')){await updateDoc(doc(fs,'profiles',f.phone),{title:(f.title||'').trim(),bio:(f.bio||'').trim(),show:!!f.show});say('Saved ✅')}
 else if(id==='post'){await addDoc(dbc('announcements'),{title:f.title.trim(),body:f.body.trim(),ts:Date.now(),by:me.name});e.target.reset();say('Published 📣')}
 else if(id==='set'){await setDoc(doc(fs,'settings','main'),{target:Math.round(+f.target)});say('Saved ✅')}
 }catch(x){fail(x)}finally{if(btn)btn.disabled=false}});

/* ===== 3-DAY SESSION ===== */
(async()=>{const last=+localStorage.getItem('dae_last')||0;if(last&&Date.now()-last>SESSION_DAYS*864e5){try{await signOut(auth)}catch{}}localStorage.setItem('dae_last',Date.now())})();
</script></body></html>
